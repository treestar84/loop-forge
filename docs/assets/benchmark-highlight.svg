<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" role="img" aria-labelledby="title desc">
  <title id="title">탐색·학습 후보 도입 전후 챗봇 AI(Opus) 승률</title>
  <desc id="desc">윙스팬과 하스스톤에서 챗봇 AI Opus의 승률이 탐색 학습 후보 도입 후 각각 52.6, 29.9 퍼센트포인트 감소한 비교 차트</desc>
  <defs>
    <linearGradient id="ember" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff8a3d"/>
      <stop offset="100%" stop-color="#ffcf5c"/>
    </linearGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff8a3d"/>
      <stop offset="100%" stop-color="#ffdc73"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-60%" width="160%" height="220%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="900" height="380" rx="20" fill="#14171f"/>
  <rect x="1" y="1" width="898" height="378" rx="19" fill="none" stroke="#252b36"/>

  <text id="titleText" x="40" y="43" fill="#e8ecf4" font-family="Inter, Pretendard, Apple SD Gothic Neo, sans-serif" font-size="16" font-weight="700">탐색·학습 후보 도입 전후 — 챗봇 AI(Opus) 승률 (낮을수록 Loop Forge 우위)</text>
  <text x="40" y="65" fill="#8890a0" font-family="Inter, Pretendard, Apple SD Gothic Neo, sans-serif" font-size="11">같은 측정 문맥 내 비교</text>

  <g font-family="Inter, Pretendard, Apple SD Gothic Neo, sans-serif" font-size="11" fill="#b9c0ce">
    <rect x="716" y="31" width="10" height="10" rx="2" fill="#b5544a"/>
    <text x="732" y="40">이전</text>
    <rect x="778" y="31" width="18" height="10" rx="2" fill="url(#ember)"/>
    <text x="802" y="40">이후</text>
  </g>

  <!-- scale -->
  <g stroke="#2a2f3a" stroke-width="1">
    <line x1="205" y1="103" x2="205" y2="320"/>
    <line x1="315" y1="103" x2="315" y2="320"/>
    <line x1="425" y1="103" x2="425" y2="320"/>
    <line x1="535" y1="103" x2="535" y2="320"/>
    <line x1="645" y1="103" x2="645" y2="320"/>
  </g>
  <g fill="#8890a0" font-family="Inter, Pretendard, Apple SD Gothic Neo, sans-serif" font-size="10" text-anchor="middle">
    <text x="205" y="94">0%</text><text x="315" y="94">25%</text><text x="425" y="94">50%</text><text x="535" y="94">75%</text><text x="645" y="94">100%</text>
  </g>

  <!-- Wingspan -->
  <text x="40" y="155" fill="#e8ecf4" font-family="Inter, Pretendard, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="700">윙스팬</text>
  <text x="40" y="174" fill="#8890a0" font-family="Inter, Pretendard, Apple SD Gothic Neo, sans-serif" font-size="11">챗봇 AI(Opus)의 승률</text>
  <text x="166" y="132" fill="#8890a0" font-family="Inter, Pretendard, Apple SD Gothic Neo, sans-serif" font-size="11" text-anchor="end">이전</text>
  <rect x="205" y="117" width="338.36" height="18" rx="5" fill="#b5544a"/>
  <text x="551" y="131" fill="#f5f6f9" font-family="Inter, Pretendard, Apple SD Gothic Neo, sans-serif" font-size="12" font-weight="700">76.9%</text>
  <text x="166" y="160" fill="#ffbd70" font-family="Inter, Pretendard, Apple SD Gothic Neo, sans-serif" font-size="11" text-anchor="end">이후</text>
  <rect x="205" y="145" width="106.92" height="18" rx="5" fill="url(#ember)" filter="url(#glow)"/>
  <text x="320" y="159" fill="#f5f6f9" font-family="Inter, Pretendard, Apple SD Gothic Neo, sans-serif" font-size="12" font-weight="700">24.3%</text>
  <path d="M660 124 C675 124 675 148 688 148 M682 141 L689 149 L679 153" fill="none" stroke="url(#ember)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="704" y="112" width="154" height="54" rx="14" fill="url(#chip)" filter="url(#glow)"/>
  <text x="781" y="146" fill="#231a16" font-family="Inter, Pretendard, Apple SD Gothic Neo, sans-serif" font-size="22" font-weight="800" text-anchor="middle">−52.6%p</text>

  <line x1="40" y1="205" x2="858" y2="205" stroke="#2a2f3a"/>

  <!-- Hearthstone -->
  <text x="40" y="270" fill="#e8ecf4" font-family="Inter, Pretendard, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="700">하스스톤</text>
  <text x="40" y="289" fill="#8890a0" font-family="Inter, Pretendard, Apple SD Gothic Neo, sans-serif" font-size="11">챗봇 AI(Opus)의 승률</text>
  <text x="166" y="247" fill="#8890a0" font-family="Inter, Pretendard, Apple SD Gothic Neo, sans-serif" font-size="11" text-anchor="end">이전</text>
  <rect x="205" y="232" width="425.92" height="18" rx="5" fill="#b5544a"/>
  <text x="639" y="246" fill="#f5f6f9" font-family="Inter, Pretendard, Apple SD Gothic Neo, sans-serif" font-size="12" font-weight="700">96.8%</text>
  <text x="166" y="275" fill="#ffbd70" font-family="Inter, Pretendard, Apple SD Gothic Neo, sans-serif" font-size="11" text-anchor="end">이후</text>
  <rect x="205" y="260" width="294.36" height="18" rx="5" fill="url(#ember)" filter="url(#glow)"/>
  <text x="508" y="274" fill="#f5f6f9" font-family="Inter, Pretendard, Apple SD Gothic Neo, sans-serif" font-size="12" font-weight="700">66.9%</text>
  <path d="M660 239 C675 239 675 263 688 263 M682 256 L689 264 L679 268" fill="none" stroke="url(#ember)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="704" y="227" width="154" height="54" rx="14" fill="url(#chip)" filter="url(#glow)"/>
  <text x="781" y="261" fill="#231a16" font-family="Inter, Pretendard, Apple SD Gothic Neo, sans-serif" font-size="22" font-weight="800" text-anchor="middle">−29.9%p</text>

  <text x="40" y="342" fill="#667083" font-family="Inter, Pretendard, Apple SD Gothic Neo, sans-serif" font-size="10">0–100% 상대 승률</text>
</svg>
